name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: clippy, default features
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, toolchain input selects the version
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo test (default features, pure Rust)
        run: cargo test --locked --all-targets
      # --all-targets skips doctests, and the compile_fail doctests in
      # skmem::audience pin the owner-only gates: run them explicitly.
      - name: cargo test --doc (compile_fail doctests)
        run: cargo test --locked --doc
      - name: forging constructors are unreachable (each crate must fail for the EXPECTED reason)
        if: matrix.rust == 'stable'
        run: tests/forge_check/check.sh

  pg:
    name: pg arms (skmem-pg container, rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "stable"]
    env:
      SKMEM_PG_TEST_DSN: postgresql://postgres:ci@127.0.0.1:5432/postgres
      SKMEM_PG_TEST_REQUIRE: "1"
      # skmem-pg has pg_search and AGE: BM25 and graph tests must run, not skip
      SKMEM_PG_TEST_AGE: "1"
      SKMEM_PG_TEST_BM25: "1"
    steps:
      - name: start skmem-pg (public image, pinned by digest)
        # A service container cannot pass server arguments, and pg_search must be
        # in shared_preload_libraries, so the container is started by hand.
        run: |
          docker run -d --name skmem-pg -e POSTGRES_PASSWORD=ci -p 127.0.0.1:5432:5432 \
            smilintux/skmem-pg@sha256:60ae44048a71cc678144bbce0184882e391307ebd3a248bfbf859b0ad65550e9 \
            postgres -c shared_preload_libraries=pg_search,age
          for i in $(seq 1 60); do
            docker exec skmem-pg pg_isready -h 127.0.0.1 -U postgres && exit 0
            sleep 2
          done
          docker logs skmem-pg
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, toolchain input selects the version
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: clippy, pg feature
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets --features pg -- -D warnings
      - name: cargo test, pg feature (database tests are required, not skipped)
        run: cargo test --locked --features pg --all-targets
      - name: cargo test --doc, pg feature
        run: cargo test --locked --features pg --doc

  python-wheel:
    name: python feature (maturin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: clippy, python feature
        run: cargo clippy --locked --all-targets --features python -- -D warnings
      - run: python -m pip install --upgrade pip "maturin>=1.5,<2.0"
      - name: maturin build
        run: maturin build --release --locked --out dist
      - name: smoke-import the built wheel
        run: |
          python -m pip install --no-index --find-links dist skmem-core
          python -c "import skmem_core; print('skmem_core', skmem_core.version())"
